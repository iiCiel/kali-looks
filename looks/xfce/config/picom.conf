# cupertino-xfce: frosted blur, rounded corners and soft macOS-style shadows.
# Installed to ~/.config/cupertino-xfce/picom.conf and started from
# ~/.config/autostart/cupertino-xfce-picom.desktop. Your own picom.conf is not touched.

backend = "glx";
vsync = true;
use-damage = true;

# Frosted glass behind translucent windows (menu bar, dock, Spotlight)
blur-method = "dual_kawase";
blur-strength = 7;
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Plank'",
  "class_g = 'xfce4-screenshooter'",
  "_GTK_FRAME_EXTENTS@"
];

# Rounded window corners. The dock gets a larger radius; the thin menu bar none.
corner-radius = 12;
corner-radius-rules = [
  "18:window_type = 'dock' && height > 40",
  "0:window_type = 'dock'",
  "14:class_g = 'Rofi'"
];
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Plank'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "_NET_WM_STATE@[*] = '_NET_WM_STATE_FULLSCREEN'"
];

# Soft shadows
shadow = true;
shadow-radius = 28;
shadow-opacity = 0.32;
shadow-offset-x = -28;
shadow-offset-y = -18;
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "class_g = 'Rofi' && width > 1500",
  "_GTK_FRAME_EXTENTS@",
  "_NET_WM_STATE@[*] = '_NET_WM_STATE_FULLSCREEN'"
];

# Gentle fades
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 5;
