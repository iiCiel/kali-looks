<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <!-- kali-looks: an original green "start" button in the spirit of 2001-era taskbars -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd57f"/>
      <stop offset="0.10" stop-color="#4cb54c"/>
      <stop offset="0.45" stop-color="#36a136"/>
      <stop offset="0.80" stop-color="#2f952f"/>
      <stop offset="1" stop-color="#1d6b1d"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcefdc"/>
    </radialGradient>
  </defs>
  <path d="M0 0 H168 C186 0 200 13 200 30 C200 47 186 60 168 60 H0 Z" fill="url(#body)"/>
  <path d="M0 2 H166 C180 2 191 7 194 16 H0 Z" fill="url(#gloss)"/>
  <path d="M0 59 H168 C180 59 190 54 195 46" fill="none" stroke="#174f17" stroke-width="2" stroke-opacity="0.6"/>
  <!-- a simple four-dot mark -->
  <g transform="translate(24 16)">
    <circle cx="7" cy="7" r="6" fill="url(#orb)"/>
    <circle cx="21" cy="7" r="6" fill="url(#orb)" opacity="0.9"/>
    <circle cx="7" cy="21" r="6" fill="url(#orb)" opacity="0.9"/>
    <circle cx="21" cy="21" r="6" fill="url(#orb)" opacity="0.8"/>
  </g>
  <text x="62" y="41" font-family="Tahoma, 'DejaVu Sans', sans-serif" font-size="29" font-style="italic" font-weight="bold" fill="#103a10" fill-opacity="0.55">start</text>
  <text x="60" y="39" font-family="Tahoma, 'DejaVu Sans', sans-serif" font-size="29" font-style="italic" font-weight="bold" fill="#ffffff">start</text>
</svg>
